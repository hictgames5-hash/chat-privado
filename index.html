<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Privado</title>
  <style>
    /* Estilos Globais e Variáveis de Tema */
    :root {
      --bg-body: #1e1e1e;
      --bg-container: #2d2d2d;
      --bg-chat: #181818;
      --bg-input: #222222;
      --bg-msg-minha: #007acc;
      --bg-msg-outro: #3a3a3a;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #444444;
      --btn-bg: #444444;
      --btn-hover: #555555;
    }

    /* Tema Claro */
    body.light-mode {
      --bg-body: #f0f2f5;
      --bg-container: #ffffff;
      --bg-chat: #f9f9f9;
      --bg-input: #ffffff;
      --bg-msg-minha: #0084ff;
      --bg-msg-outro: #e4e6eb;
      --text-main: #050505;
      --text-muted: #65676b;
      --border-color: #cccccc;
      --btn-bg: #e4e6eb;
      --btn-hover: #d8dadf;
    }

    body { 
      font-family: sans-serif; 
      background: var(--bg-body); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      transition: background 0.3s, color 0.3s;
    }

    #chat-container { 
      width: 100%; 
      max-width: 480px; 
      background: var(--bg-container); 
      border-radius: 8px; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      height: 580px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    
    #topo-acoes { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 10px; 
      gap: 6px; 
      flex-wrap: wrap;
    }
    .btn-top { 
      background: var(--btn-bg); 
      color: var(--text-main); 
      border: none; 
      padding: 6px 10px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.85em; 
    }
    .btn-top:hover { background: var(--btn-hover); }

    #mensagens { 
      flex: 1; 
      overflow-y: auto; 
      margin-bottom: 5px; 
      border: 1px solid var(--border-color); 
      border-radius: 4px; 
      padding: 10px; 
      background: var(--bg-chat); 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.minha { align-self: flex-end; }
    .msg-wrapper.outro { align-self: flex-start; }
    .msg-wrapper.sistema { align-self: center; max-width: 100%; }

    .msg { 
      padding: 8px 12px; 
      border-radius: 6px; 
      word-break: break-word; 
      font-size: 0.95em; 
      position: relative; 
    }
    .minha .msg { background: var(--bg-msg-minha); color: #fff; }
    .outro .msg { background: var(--bg-msg-outro); color: var(--text-main); }
    .sistema .msg { background: transparent; color: var(--text-muted); font-style: italic; font-size: 0.85em; text-align: center; }

    /* Horário e Status da Mensagem */
    .msg-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 0.7em;
      opacity: 0.8;
      margin-top: 4px;
    }

    .status-lido {
      font-weight: bold;
      color: #70e000;
    }
    body.light-mode .minha .status-lido {
      color: #a0ff80;
    }

    .acoes-msg { display: flex; gap: 6px; margin-top: 3px; font-size: 0.75em; }
    .minha .acoes-msg { justify-content: flex-end; }
    .outro .acoes-msg { justify-content: flex-start; }
    
    .btn-acao { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0 2px; font-size: 0.85em; }
    .btn-acao:hover { color: var(--text-main); text-decoration: underline; }

    /* Indicador de Digitando */
    #indicador-digitando {
      height: 18px;
      font-size: 0.8em;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 5px;
      padding-left: 4px;
    }

    #controles { display: flex; gap: 8px; }
    input[type="text"] { 
      flex: 1; 
      padding: 10px; 
      border-radius: 4px; 
      border: 1px solid var(--border-color); 
      background: var(--bg-input); 
      color: var(--text-main); 
      outline: none; 
    }
    button.btn-enviar { 
      padding: 10px 18px; 
      background: #007acc; 
      border: none; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    button.btn-enviar:hover { background: #005999; }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="topo-acoes">
    <button class="btn-top" onclick="exportarConversa()">💾 Salvar</button>
    <button class="btn-top" onclick="document.getElementById('inputImportar').click()">📂 Carregar</button>
    <input type="file" id="inputImportar" accept=".json" style="display: none;" onchange="importarConversa(event)">
    <button class="btn-top" id="btnSom" onclick="alternarSom()">🔔 Som: ON</button>
    <button class="btn-top" onclick="alternarTema()">🌙/☀️ Tema</button>
  </div>

  <div id="mensagens"></div>

  <div id="indicador-digitando"></div>

  <div id="controles">
    <input type="text" id="inputMensagem" placeholder="Digite uma mensagem..." oninput="notificarDigitando()">
    <button class="btn-enviar" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${protocol}//${location.host}`);
  const areaMensagens = document.getElementById('mensagens');
  const input = document.getElementById('inputMensagem');
  const indicadorDigitando = document.getElementById('indicador-digitando');

  let historicoMensagens = [];
  let somAtivo = true;
  let tempoDigitandoTimer = null;
  let estaDigitando = false;

  // Áudio Sintético para o Bip Sonoro (Web Audio API)
  function tocarSomBip() {
    if (!somAtivo) return;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {
      console.log('Erro ao reproduzir som:', e);
    }
  }

  function alternarSom() {
    somAtivo = !somAtivo;
    document.getElementById('btnSom').textContent = somAtivo ? '🔔 Som: ON' : '🔕 Som: OFF';
  }

  function alternarTema() {
    document.body.classList.toggle('light-mode');
  }

  // Notificar quando a página está visível e focada para confirmação de leitura
  function enviarConfirmacaoLeitura() {
    if (document.visibilityState === 'visible') {
      ws.send(JSON.stringify({ tipo: 'ler_mensagens' }));
    }
  }

  window.addEventListener('focus', enviarConfirmacaoLeitura);
  document.addEventListener('visibilitychange', enviarConfirmacaoLeitura);

  ws.onmessage = (event) => {
    const dados = JSON.parse(event.data);

    if (dados.tipo === 'nova_msg') {
      adicionarMensagemNaTela(dados.id, dados.texto, 'outro', dados.horario, false);
      historicoMensagens.push({ id: dados.id, texto: dados.texto, tipo: 'outro', horario: dados.horario, lido: false });
      
      tocarSomBip();
      enviarConfirmacaoLeitura();
    } 
    else if (dados.tipo === 'editar_msg') {
      atualizarMensagemNaTela(dados.id, dados.texto);
      const item = historicoMensagens.find(m => m.id === dados.id);
      if (item) item.texto = dados.texto;
    } 
    else if (dados.tipo === 'excluir_msg') {
      removerMensagemDaTela(dados.id);
      historicoMensagens = historicoMensagens.filter(m => m.id !== dados.id);
    } 
    else if (dados.tipo === 'sistema') {
      adicionarMensagemSistema(dados.texto);
    }
    else if (dados.tipo === 'digitando') {
      if (dados.estado) {
        indicadorDigitando.textContent = 'O outro usuário está digitando...';
      } else {
        indicadorDigitando.textContent = '';
      }
    }
    else if (dados.tipo === 'mensagens_lidas') {
      // Marca todas as mensagens 'minhas' como lidas
      document.querySelectorAll('.minha .status-lido').forEach(el => {
        el.textContent = '✓✓';
      });
      historicoMensagens.forEach(m => {
        if (m.tipo === 'minha') m.lido = true;
      });
    }
  };

  function notificarDigitando() {
    if (!estaDigitando) {
      estaDigitando = true;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: true }));
    }

    clearTimeout(tempoDigitandoTimer);
    tempoDigitandoTimer = setTimeout(() => {
      estaDigitando = false;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));
    }, 1500);
  }

  function enviar() {
    const texto = input.value.trim();
    if (!texto) return;

    const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
    const agora = new Date();
    const horario = agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    // Envia ao servidor
    ws.send(JSON.stringify({ tipo: 'nova_msg', id: id, texto: texto, horario: horario }));

    // Parar estado de digitando imediatamente
    clearTimeout(tempoDigitandoTimer);
    estaDigitando = false;
    ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));

    // Exibe localmente
    adicionarMensagemNaTela(id, texto, 'minha', horario, false);
    historicoMensagens.push({ id: id, texto: texto, tipo: 'minha', horario: horario, lido: false });

    input.value = '';
  }

  function adicionarMensagemNaTela(id, texto, tipo, horario, lido) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', tipo);
    wrapper.id = `msg-${id}`;

    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');
    
    // Conteúdo do texto
    const divTexto = document.createElement('div');
    divTexto.textContent = texto;
    divMsg.appendChild(divTexto);

    // Rodapé da mensagem (horário e status de leitura)
    if (tipo !== 'sistema') {
      const divInfo = document.createElement('div');
      divInfo.classList.add('msg-info');

      const spanHorario = document.createElement('span');
      spanHorario.textContent = horario || '';
      divInfo.appendChild(spanHorario);

      if (tipo === 'minha') {
        const spanStatus = document.createElement('span');
        spanStatus.classList.add('status-lido');
        spanStatus.textContent = lido ? '✓✓' : '✓';
        divInfo.appendChild(spanStatus);
      }

      divMsg.appendChild(divInfo);
    }

    wrapper.appendChild(divMsg);

    if (tipo !== 'sistema') {
      const acoes = document.createElement('div');
      acoes.classList.add('acoes-msg');

      const btnCopiar = document.createElement('button');
      btnCopiar.classList.add('btn-acao');
      btnCopiar.textContent = 'Copiar';
      btnCopiar.onclick = () => copiarTexto(texto);
      acoes.appendChild(btnCopiar);

      if (tipo === 'minha') {
        const btnEditar = document.createElement('button');
        btnEditar.classList.add('btn-acao');
        btnEditar.textContent = 'Editar';
        btnEditar.onclick = () => editarMensagem(id);

        const btnExcluir = document.createElement('button');
        btnExcluir.classList.add('btn-acao');
        btnExcluir.textContent = 'Excluir';
        btnExcluir.onclick = () => excluirMensagem(id);

        acoes.appendChild(btnEditar);
        acoes.appendChild(btnExcluir);
      }

      wrapper.appendChild(acoes);
    }

    areaMensagens.appendChild(wrapper);
    areaMensagens.scrollTop = areaMensagens.scrollHeight;
  }

  function adicionarMensagemSistema(texto) {
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', 'sistema');
    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');
    divMsg.textContent = texto;
    wrapper.appendChild(divMsg);
    areaMensagens.appendChild(wrapper);
    areaMensagens.scrollTop = areaMensagens.scrollHeight;
  }

  function copiarTexto(texto) {
    navigator.clipboard.writeText(texto).then(() => {
      alert('Mensagem copiada!');
    });
  }

  function editarMensagem(id) {
    const wrapper = document.getElementById(`msg-${id}`);
    if (!wrapper) return;
    const msgTextoDiv = wrapper.querySelector('.msg > div');
    
    const novoTexto = prompt('Edite sua mensagem:', msgTextoDiv.textContent);
    if (novoTexto !== null && novoTexto.trim() !== '') {
      const textoFormatado = novoTexto.trim();
      msgTextoDiv.textContent = textoFormatado;

      const item = historicoMensagens.find(m => m.id === id);
      if (item) item.texto = textoFormatado;

      ws.send(JSON.stringify({ tipo: 'editar_msg', id: id, texto: textoFormatado }));
    }
  }

  function atualizarMensagemNaTela(id, novoTexto) {
    const wrapper = document.getElementById(`msg-${id}`);
    if (wrapper) {
      const msgTextoDiv = wrapper.querySelector('.msg > div');
      if (msgTextoDiv) msgTextoDiv.textContent = novoTexto;
    }
  }

  function excluirMensagem(id) {
    if (confirm('Deseja realmente apagar esta mensagem?')) {
      removerMensagemDaTela(id);
      historicoMensagens = historicoMensagens.filter(m => m.id !== id);
      ws.send(JSON.stringify({ tipo: 'excluir_msg', id: id }));
    }
  }

  function removerMensagemDaTela(id) {
    const wrapper = document.getElementById(`msg-${id}`);
    if (wrapper) wrapper.remove();
  }

  // --- Salvar e Importar Conversa ---
  function exportarConversa() {
    if (historicoMensagens.length === 0) {
      alert('Não há mensagens para salvar.');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historicoMensagens, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `conversa_chat_${Date.now()}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importarConversa(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const mensagensCarregadas = JSON.parse(e.target.result);
        if (Array.isArray(mensagensCarregadas)) {
          areaMensagens.innerHTML = '';
          historicoMensagens = mensagensCarregadas;
          mensagensCarregadas.forEach(msg => {
            if (msg.tipo === 'minha' || msg.tipo === 'outro') {
              adicionarMensagemNaTela(msg.id, msg.texto, msg.tipo, msg.horario, msg.lido);
            }
          });
          adicionarMensagemSistema('--- Conversa importada com sucesso ---');
        }
      } catch (err) {
        alert('Erro ao carregar o arquivo. Certifique-se de que é um arquivo de conversa válido.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enviar();
  });
</script>

</body>
</html>
