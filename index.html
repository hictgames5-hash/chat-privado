<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Seguro com Salas e Senha</title>
  <style>
    :root {
      --bg-body: #1e1e1e;
      --bg-container: #2d2d2d;
      --bg-chat: #181818;
      --bg-input: #222222;
      --bg-msg-minha: #007acc;
      --bg-msg-outro: #3a3a3a;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #444444;
      --btn-bg: #444444;
      --btn-hover: #555555;
    }

    body.light-mode {
      --bg-body: #f0f2f5;
      --bg-container: #ffffff;
      --bg-chat: #f9f9f9;
      --bg-input: #ffffff;
      --bg-msg-minha: #0084ff;
      --bg-msg-outro: #e4e6eb;
      --text-main: #050505;
      --text-muted: #65676b;
      --border-color: #cccccc;
      --btn-bg: #e4e6eb;
      --btn-hover: #d8dadf;
    }

    body { 
      font-family: sans-serif; 
      background: var(--bg-body); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }

    /* Tela de Login / Apelido / Senha */
    .tela-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      background: var(--bg-container);
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin-top: 0; color: var(--text-main); }
    .modal-box input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
    }
    .modal-box button {
      padding: 10px;
      background: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-box button:hover { background: #005999; }

    #chat-container { 
      width: 100%; 
      max-width: 480px; 
      background: var(--bg-container); 
      border-radius: 8px; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      height: 600px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    
    #topo-acoes { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 8px; 
      gap: 5px; 
      flex-wrap: wrap;
    }
    .btn-top { 
      background: var(--btn-bg); 
      color: var(--text-main); 
      border: none; 
      padding: 5px 8px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.8em; 
    }
    .btn-top:hover { background: var(--btn-hover); }
    .btn-host { background: #d90429 !important; color: white !important; }
    .btn-host:hover { background: #8d0801 !important; }

    #info-sala {
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #mensagens { 
      flex: 1; 
      overflow-y: auto; 
      margin-bottom: 5px; 
      border: 1px solid var(--border-color); 
      border-radius: 4px; 
      padding: 10px; 
      background: var(--bg-chat); 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.minha { align-self: flex-end; }
    .msg-wrapper.outro { align-self: flex-start; }
    .msg-wrapper.sistema { align-self: center; max-width: 100%; }

    .msg { 
      padding: 8px 12px; 
      border-radius: 6px; 
      word-break: break-word; 
      font-size: 0.95em; 
    }
    .autor-msg { font-size: 0.75em; font-weight: bold; color: #00adb5; margin-bottom: 2px; }
    .minha .msg { background: var(--bg-msg-minha); color: #fff; }
    .outro .msg { background: var(--bg-msg-outro); color: var(--text-main); }
    .sistema .msg { background: transparent; color: var(--text-muted); font-style: italic; font-size: 0.85em; text-align: center; }

    .msg-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 0.7em;
      opacity: 0.8;
      margin-top: 4px;
    }
    .status-lido { font-weight: bold; color: #70e000; }

    .acoes-msg { display: flex; gap: 6px; margin-top: 3px; font-size: 0.75em; }
    .minha .acoes-msg { justify-content: flex-end; }
    .outro .acoes-msg { justify-content: flex-start; }
    .btn-acao { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0 2px; font-size: 0.85em; }
    .btn-acao:hover { color: var(--text-main); text-decoration: underline; }

    #indicador-digitando {
      height: 18px;
      font-size: 0.8em;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 5px;
      padding-left: 4px;
    }

    #controles { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] { 
      flex: 1; 
      padding: 10px; 
      border-radius: 4px; 
      border: 1px solid var(--border-color); 
      background: var(--bg-input); 
      color: var(--text-main); 
      outline: none; 
    }
    button.btn-enviar { 
      padding: 10px 18px; 
      background: #007acc; 
      border: none; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    button.btn-enviar:hover { background: #005999; }
  </style>
</head>
<body>

<!-- TELA 1: APELIDO -->
<div id="tela-apelido" class="tela-overlay">
  <div class="modal-box">
    <h3>Bem-vindo ao Chat!</h3>
    <p style="font-size: 0.85em; color: var(--text-muted);">Escolha seu apelido para entrar:</p>
    <input type="text" id="inputApelido" placeholder="Seu apelido..." maxlength="15">
    <button onclick="salvarApelido()">Entrar na Sala</button>
  </div>
</div>

<!-- TELA 2: SENHA DA SALA (Caso seja privada) -->
<div id="tela-senha" class="tela-overlay" style="display: none;">
  <div class="modal-box">
    <h3>🔒 Sala Protegida</h3>
    <p style="font-size: 0.85em; color: var(--text-muted);">Esta sala exige uma senha para entrar:</p>
    <input type="password" id="inputSenhaSala" placeholder="Digite sua Senha">
    <button onclick="enviarSenha()">Desbloquear</button>
  </div>
</div>

<!-- TELA PRINCIPAL DO CHAT -->
<div id="chat-container">
  <div id="topo-acoes">
    <button class="btn-top" onclick="exportarConversa()">💾 Salvar</button>
    <button class="btn-top" id="btnSom" onclick="alternarSom()">🔔 Som: ON</button>
    <button class="btn-top" onclick="alternarTema()">🌙/☀️</button>
    <button class="btn-top" onclick="mudarSala()">🚪 Mudar Sala</button>
    <button class="btn-top btn-host" id="btnPainelHost" style="display: none;" onclick="abrirPainelHost()">⚙️ Host</button>
  </div>

  <div id="info-sala">
    <span>Sala: <strong id="nome-sala-exibicao">geral</strong></span>
    <span id="contador-vagas">Participantes: 1</span>
  </div>

  <div id="mensagens"></div>
  <div id="indicador-digitando"></div>

  <div id="controles">
    <input type="text" id="inputMensagem" placeholder="Digite uma mensagem..." oninput="notificarDigitando()">
    <button class="btn-enviar" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  let salaAtual = params.get('sala') || 'geral';
  document.getElementById('nome-sala-exibicao').textContent = salaAtual;

  let meuApelido = localStorage.getItem('chat_apelido') || '';
  if (meuApelido) {
    document.getElementById('tela-apelido').style.display = 'none';
  }

  function salvarApelido() {
    const val = document.getElementById('inputApelido').value.trim();
    if (!val) {
      alert('Digite um apelido válido!');
      return;
    }
    meuApelido = val;
    localStorage.setItem('chat_apelido', meuApelido);
    document.getElementById('tela-apelido').style.display = 'none';
    conectarWebSocket();
  }

  if (meuApelido) {
    conectarWebSocket();
  }

  let ws;
  let somAtivo = true;
  let historicoMensagens = [];
  let tempoDigitandoTimer = null;
  let estaDigitando = false;
  let souHost = false;

  function conectarWebSocket() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ tipo: 'entrar_sala', sala: salaAtual, apelido: meuApelido }));
    };

    ws.onmessage = (event) => {
      const dados = JSON.parse(event.data);

      if (dados.tipo === 'pedir_senha') {
        document.getElementById('tela-senha').style.display = 'flex';
      }
      else if (dados.tipo === 'senha_rejeitada') {
        alert('Senha incorreta!');
        document.getElementById('inputSenhaSala').value = '';
      }
      else if (dados.tipo === 'acesso_liberado') {
        document.getElementById('tela-senha').style.display = 'none';
      }
      else if (dados.tipo === 'status_host') {
        souHost = dados.ehHost;
        if (souHost) {
          document.getElementById('btnPainelHost').style.display = 'inline-block';
        }
      }
      else if (dados.tipo === 'atualizar_vagas') {
        document.getElementById('contador-vagas').textContent = `Participantes: ${dados.atual}/${dados.limite}`;
      }
      else if (dados.tipo === 'expulso') {
        alert('Você foi removido da sala pelo anfitrião.');
        window.location.href = '/';
      }
      else if (dados.tipo === 'nova_msg') {
        adicionarMensagemNaTela(dados.id, dados.autor, dados.texto, 'outro', dados.horario, false);
        historicoMensagens.push({ id: dados.id, autor: dados.autor, texto: dados.texto, tipo: 'outro', horario: dados.horario, lido: false });
        tocarSomBip();
      }
      else if (dados.tipo === 'sistema') {
        adicionarMensagemSistema(dados.texto);
      }
      else if (dados.tipo === 'digitando') {
        document.getElementById('indicador-digitando').textContent = dados.estado ? `${dados.autor} está digitando...` : '';
      }
    };
  }

  function enviarSenha() {
    const senha = document.getElementById('inputSenhaSala').value;
    ws.send(JSON.stringify({ tipo: 'verificar_senha', senha: senha }));
  }

  function abrirPainelHost() {
    if (!souHost) return;
    const acao = prompt('Painel do Anfitrião:\n1 - Definir Senha da Sala (vazio para remover)\n2 - Definir Limite Máximo de Pessoas\n\nDigite 1 ou 2:');
    if (acao === '1') {
      const novaSenha = prompt('Digite a nova senha para o grupo (ou deixe em branco para tornar público):');
      ws.send(JSON.stringify({ tipo: 'config_senha', senha: novaSenha || '' }));
    } else if (acao === '2') {
      const novoLimite = prompt('Digite o número máximo de pessoas na sala:');
      if (novoLimite && !isNaN(novoLimite)) {
        ws.send(JSON.stringify({ tipo: 'config_limite', limite: parseInt(novoLimite) }));
      }
    }
  }

  function tocarSomBip() {
    if (!somAtivo) return;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function alternarSom() {
    somAtivo = !somAtivo;
    document.getElementById('btnSom').textContent = somAtivo ? '🔔 Som: ON' : '🔕 Som: OFF';
  }

  function alternarTema() {
    document.body.classList.toggle('light-mode');
  }

  function mudarSala() {
    const novaSala = prompt('Digite o nome da sala que deseja entrar:', salaAtual);
    if (novaSala && novaSala.trim() !== '') {
      const salaLimpa = novaSala.trim().toLowerCase().replace(/\s+/g, '-');
      window.location.href = `?sala=${salaLimpa}`;
    }
  }

  function enviar() {
    const input = document.getElementById('inputMensagem');
    const texto = input.value.trim();
    if (!texto) return;

    const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
    const horario = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    ws.send(JSON.stringify({ tipo: 'nova_msg', id: id, texto: texto, horario: horario }));

    clearTimeout(tempoDigitandoTimer);
    ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));

    adicionarMensagemNaTela(id, meuApelido, texto, 'minha', horario, false);
    historicoMensagens.push({ id: id, autor: meuApelido, texto: texto, tipo: 'minha', horario: horario, lido: false });

    input.value = '';
  }

  function notificarDigitando() {
    if (!estaDigitando) {
      estaDigitando = true;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: true }));
    }
    clearTimeout(tempoDigitandoTimer);
    tempoDigitandoTimer = setTimeout(() => {
      estaDigitando = false;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));
    }, 1500);
  }

  function adicionarMensagemNaTela(id, autor, texto, tipo, horario, lido) {
    const area = document.getElementById('mensagens');
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', tipo);
    wrapper.id = `msg-${id}`;

    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');

    if (tipo === 'outro') {
      const divAutor = document.createElement('div');
      divAutor.classList.add('autor-msg');
      divAutor.textContent = autor;
      divMsg.appendChild(divAutor);
    }

    const divTexto = document.createElement('div');
    divTexto.textContent = texto;
    divMsg.appendChild(divTexto);

    wrapper.appendChild(divMsg);
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;
  }

  function adicionarMensagemSistema(texto) {
    const area = document.getElementById('mensagens');
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', 'sistema');
    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');
    divMsg.textContent = texto;
    wrapper.appendChild(divMsg);
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;
  }

  function exportarConversa() {
    if (historicoMensagens.length === 0) {
      alert('Sem mensagens para salvar.');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historicoMensagens, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `chat_${salaAtual}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  document.getElementById('inputMensagem').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enviar();
  });
</script>

</body>
</html>
