<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Seguro com Salas</title>
  <style>
    :root {
      --bg-body: #1e1e1e;
      --bg-container: #2d2d2d;
      --bg-chat: #181818;
      --bg-input: #222222;
      --bg-msg-minha: #007acc;
      --bg-msg-outro: #3a3a3a;
      --text-main: #ffffff;
      --text-muted: #888888;
      --border-color: #444444;
      --btn-bg: #444444;
      --btn-hover: #555555;
    }

    body.light-mode {
      --bg-body: #f0f2f5;
      --bg-container: #ffffff;
      --bg-chat: #f9f9f9;
      --bg-input: #ffffff;
      --bg-msg-minha: #0084ff;
      --bg-msg-outro: #e4e6eb;
      --text-main: #050505;
      --text-muted: #65676b;
      --border-color: #cccccc;
      --btn-bg: #e4e6eb;
      --btn-hover: #d8dadf;
    }

    body { 
      font-family: sans-serif; 
      background: var(--bg-body); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }

    /* Modais e Overlays */
    .tela-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      background: var(--bg-container);
      padding: 22px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin: 0; color: var(--text-main); }
    .modal-box input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
    }
    .modal-box button {
      padding: 9px 14px;
      background: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal-box button:hover { background: #005999; }

    .btn-fechar-modal {
      background: #888 !important;
      margin-top: 5px;
    }

    /* Item de Configuração */
    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9em;
    }
    .config-item span { color: var(--text-main); }

    /* Toast de Notificação na Tela */
    #toast-notificacao {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85em;
      display: none;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #chat-container { 
      width: 100%; 
      max-width: 480px; 
      background: var(--bg-container); 
      border-radius: 8px; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      height: 600px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
    }
    
    #topo-acoes { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 8px; 
      gap: 5px; 
      flex-wrap: wrap;
    }
    .btn-top { 
      background: var(--btn-bg); 
      color: var(--text-main); 
      border: none; 
      padding: 6px 10px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.8em; 
    }
    .btn-top:hover { background: var(--btn-hover); }
    .btn-host { background: #d90429 !important; color: white !important; }
    .btn-host:hover { background: #8d0801 !important; }
    .btn-convite { background: #2b9348 !important; color: white !important; }

    #info-sala {
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #mensagens { 
      flex: 1; 
      overflow-y: auto; 
      margin-bottom: 5px; 
      border: 1px solid var(--border-color); 
      border-radius: 4px; 
      padding: 10px; 
      background: var(--bg-chat); 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.minha { align-self: flex-end; }
    .msg-wrapper.outro { align-self: flex-start; }
    .msg-wrapper.sistema { align-self: center; max-width: 100%; }

    .msg { 
      padding: 8px 12px; 
      border-radius: 6px; 
      word-break: break-word; 
      font-size: 0.95em; 
    }
    .autor-msg { font-size: 0.75em; font-weight: bold; color: #00adb5; margin-bottom: 2px; }
    .minha .msg { background: var(--bg-msg-minha); color: #fff; }
    .outro .msg { background: var(--bg-msg-outro); color: var(--text-main); }
    .sistema .msg { background: transparent; color: var(--text-muted); font-style: italic; font-size: 0.85em; text-align: center; }

    #indicador-digitando {
      height: 18px;
      font-size: 0.8em;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 5px;
      padding-left: 4px;
    }

    #controles { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] { 
      flex: 1; 
      padding: 10px; 
      border-radius: 4px; 
      border: 1px solid var(--border-color); 
      background: var(--bg-input); 
      color: var(--text-main); 
      outline: none; 
    }
    button.btn-enviar { 
      padding: 10px 18px; 
      background: #007acc; 
      border: none; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    button.btn-enviar:hover { background: #005999; }
  </style>
</head>
<body>

<div id="toast-notificacao"></div>

<!-- TELA: REGISTRO DE APELIDO -->
<div id="tela-apelido" class="tela-overlay">
  <div class="modal-box">
    <h3>Entrar no Chat</h3>
    <p style="font-size: 0.85em; color: var(--text-muted);">Escolha seu apelido para continuar:</p>
    <input type="text" id="inputApelido" placeholder="Seu apelido..." maxlength="15">
    <button onclick="salvarApelido()">Entrar</button>
  </div>
</div>

<!-- TELA: SENHA DA SALA -->
<div id="tela-senha" class="tela-overlay" style="display: none;">
  <div class="modal-box">
    <h3>🔒 Sala Protegida</h3>
    <p style="font-size: 0.85em; color: var(--text-muted);">Esta sala exige senha:</p>
    <input type="password" id="inputSenhaSala" placeholder="Digite sua Senha">
    <span id="erro-senha" style="color: #ff4d4d; font-size: 0.8em; display: none;">Senha incorreta!</span>
    <button onclick="enviarSenha()">Desbloquear</button>
    <button class="btn-fechar-modal" onclick="sairDaSala()">Sair da Sala</button>
  </div>
</div>

<!-- TELA: PAINEL DE CONFIGURAÇÕES -->
<div id="tela-config" class="tela-overlay" style="display: none;">
  <div class="modal-box">
    <h3>⚙️ Configurações</h3>
    
    <div class="config-item">
      <span>🔔 Som ao receber msgs:</span>
      <button class="btn-top" id="btnSomToggle" onclick="alternarSom()">ATIVADO</button>
    </div>

    <div class="config-item">
      <span>Alterar tema:</span>
      <button class="btn-top" onclick="alternarTema()">🌙/☀️</button>
    </div>

    <div class="config-item">
      <span>Nome de Usuário:</span>
      <div>
        <strong id="exibicao-apelido-config">...</strong>
        <button class="btn-top" onclick="editarApelido()" style="padding: 2px 6px;">✏️</button>
      </div>
    </div>

    <button class="btn-fechar-modal" onclick="fecharConfig()">Fechar</button>
  </div>
</div>

<!-- CONTAINER PRINCIPAL -->
<div id="chat-container">
  <div id="topo-acoes">
    <button class="btn-top" onclick="exportarConversa()">💾 Salvar</button>
    <button class="btn-top" onclick="document.getElementById('inputImportar').click()">📂 Importar</button>
    <input type="file" id="inputImportar" accept=".json" style="display: none;" onchange="importarConversa(event)">
    <button class="btn-top" onclick="abrirConfig()">⚙️ Configurações</button>
    <button class="btn-top btn-convite" onclick="compartilharConvite()">🔗 Convidar</button>
    <button class="btn-top" onclick="sairDaSala()">🚪 Sair</button>
    <button class="btn-top btn-host" id="btnPainelHost" style="display: none;" onclick="abrirPainelHost()">👑 Host</button>
  </div>

  <div id="info-sala">
    <span>Sala: <strong id="nome-sala-exibicao">geral</strong></span>
    <span id="contador-vagas">Participantes: 1</span>
  </div>

  <div id="mensagens"></div>
  <div id="indicador-digitando"></div>

  <div id="controles">
    <input type="text" id="inputMensagem" placeholder="Digite uma mensagem..." oninput="notificarDigitando()">
    <button class="btn-enviar" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  let salaAtual = params.get('sala') || 'geral';
  document.getElementById('nome-sala-exibicao').textContent = salaAtual;

  let meuApelido = localStorage.getItem('chat_apelido') || '';
  if (meuApelido) {
    document.getElementById('tela-apelido').style.display = 'none';
  }

  function mostrarToast(mensagem) {
    const toast = document.getElementById('toast-notificacao');
    toast.textContent = mensagem;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function salvarApelido() {
    const val = document.getElementById('inputApelido').value.trim();
    if (!val) return;
    meuApelido = val;
    localStorage.setItem('chat_apelido', meuApelido);
    document.getElementById('tela-apelido').style.display = 'none';
    conectarWebSocket();
  }

  if (meuApelido) {
    conectarWebSocket();
  }

  let ws;
  let somAtivo = true;
  let historicoMensagens = [];
  let tempoDigitandoTimer = null;
  let estaDigitando = false;
  let souHost = false;

  function conectarWebSocket() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ tipo: 'entrar_sala', sala: salaAtual, apelido: meuApelido }));
    };

    ws.onmessage = (event) => {
      const dados = JSON.parse(event.data);

      if (dados.tipo === 'pedir_senha') {
        document.getElementById('tela-senha').style.display = 'flex';
      }
      else if (dados.tipo === 'senha_rejeitada') {
        document.getElementById('erro-senha').style.display = 'block';
        document.getElementById('inputSenhaSala').value = '';
      }
      else if (dados.tipo === 'acesso_liberado') {
        document.getElementById('tela-senha').style.display = 'none';
      }
      else if (dados.tipo === 'status_host') {
        souHost = dados.ehHost;
        if (souHost) {
          document.getElementById('btnPainelHost').style.display = 'inline-block';
        }
      }
      else if (dados.tipo === 'atualizar_vagas') {
        document.getElementById('contador-vagas').textContent = `Participantes: ${dados.atual}/${dados.limite}`;
      }
      else if (dados.tipo === 'expulso') {
        mostrarToast('Você foi removido da sala pelo anfitrião.');
        setTimeout(() => { window.location.href = '/'; }, 1500);
      }
      else if (dados.tipo === 'nova_msg') {
        adicionarMensagemNaTela(dados.id, dados.autor, dados.texto, 'outro', dados.horario);
        historicoMensagens.push({ id: dados.id, autor: dados.autor, texto: dados.texto, tipo: 'outro', horario: dados.horario });
        tocarSomBip();
      }
      else if (dados.tipo === 'sistema') {
        adicionarMensagemSistema(dados.texto);
      }
      else if (dados.tipo === 'digitando') {
        document.getElementById('indicador-digitando').textContent = dados.estado ? `${dados.autor} está digitando...` : '';
      }
    };
  }

  function enviarSenha() {
    const senha = document.getElementById('inputSenhaSala').value;
    document.getElementById('erro-senha').style.display = 'none';
    ws.send(JSON.stringify({ tipo: 'verificar_senha', senha: senha }));
  }

  function compartilharConvite() {
    const link = `${window.location.origin}/?sala=${salaAtual}`;
    navigator.clipboard.writeText(link).then(() => {
      mostrarToast('Link de convite copiado para a área de transferência!');
    });
  }

  function sairDaSala() {
    const novaSala = prompt('Para qual sala deseja ir? (Ou digite um novo nome para criar uma):');
    if (novaSala && novaSala.trim() !== '') {
      const salaLimpa = novaSala.trim().toLowerCase().replace(/\s+/g, '-');
      window.location.href = `?sala=${salaLimpa}`;
    }
  }

  /* CONFIGURAÇÕES */
  function abrirConfig() {
    document.getElementById('exibicao-apelido-config').textContent = meuApelido;
    document.getElementById('tela-config').style.display = 'flex';
  }

  function fecharConfig() {
    document.getElementById('tela-config').style.display = 'none';
  }

  function alternarSom() {
    somAtivo = !somAtivo;
    document.getElementById('btnSomToggle').textContent = somAtivo ? 'ATIVADO' : 'DESATIVADO';
  }

  function alternarTema() {
    document.body.classList.toggle('light-mode');
  }

  function editarApelido() {
    const novoNome = prompt('Digite seu novo nome de usuário:', meuApelido);
    if (novoNome && novoNome.trim() !== '') {
      meuApelido = novoNome.trim();
      localStorage.setItem('chat_apelido', meuApelido);
      document.getElementById('exibicao-apelido-config').textContent = meuApelido;
      mostrarToast('Nome de usuário atualizado!');
      if (ws) {
        ws.send(JSON.stringify({ tipo: 'atualizar_apelido', apelido: meuApelido }));
      }
    }
  }

  function abrirPainelHost() {
    if (!souHost) return;
    const acao = prompt('Painel do Anfitrião:\n1 - Alterar/Definir Senha\n2 - Definir Limite de Participantes\n\nDigite 1 ou 2:');
    if (acao === '1') {
      const novaSenha = prompt('Digite a nova senha para o grupo (ou deixe em branco para remover):');
      ws.send(JSON.stringify({ tipo: 'config_senha', senha: novaSenha || '' }));
    } else if (acao === '2') {
      const novoLimite = prompt('Digite o limite máximo de participantes:');
      if (novoLimite && !isNaN(novoLimite)) {
        ws.send(JSON.stringify({ tipo: 'config_limite', limite: parseInt(novoLimite) }));
      }
    }
  }

  function tocarSomBip() {
    if (!somAtivo) return;
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function enviar() {
    const input = document.getElementById('inputMensagem');
    const texto = input.value.trim();
    if (!texto) return;

    const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
    const horario = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    ws.send(JSON.stringify({ tipo: 'nova_msg', id: id, texto: texto, horario: horario }));

    clearTimeout(tempoDigitandoTimer);
    ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));

    adicionarMensagemNaTela(id, meuApelido, texto, 'minha', horario);
    historicoMensagens.push({ id: id, autor: meuApelido, texto: texto, tipo: 'minha', horario: horario });

    input.value = '';
  }

  function notificarDigitando() {
    if (!estaDigitando) {
      estaDigitando = true;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: true }));
    }
    clearTimeout(tempoDigitandoTimer);
    tempoDigitandoTimer = setTimeout(() => {
      estaDigitando = false;
      ws.send(JSON.stringify({ tipo: 'digitando', estado: false }));
    }, 1500);
  }

  function adicionarMensagemNaTela(id, autor, texto, tipo, horario) {
    const area = document.getElementById('mensagens');
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', tipo);
    wrapper.id = `msg-${id}`;

    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');

    if (tipo === 'outro') {
      const divAutor = document.createElement('div');
      divAutor.classList.add('autor-msg');
      divAutor.textContent = autor;
      divMsg.appendChild(divAutor);
    }

    const divTexto = document.createElement('div');
    divTexto.textContent = texto;
    divMsg.appendChild(divTexto);

    wrapper.appendChild(divMsg);
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;
  }

  function adicionarMensagemSistema(texto) {
    const area = document.getElementById('mensagens');
    const wrapper = document.createElement('div');
    wrapper.classList.add('msg-wrapper', 'sistema');
    const divMsg = document.createElement('div');
    divMsg.classList.add('msg');
    divMsg.textContent = texto;
    wrapper.appendChild(divMsg);
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;
  }

  function exportarConversa() {
    if (historicoMensagens.length === 0) {
      mostrarToast('Nenhuma mensagem para salvar.');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historicoMensagens, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `chat_${salaAtual}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function importarConversa(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const msgs = JSON.parse(e.target.result);
        if (Array.isArray(msgs)) {
          document.getElementById('mensagens').innerHTML = '';
          historicoMensagens = msgs;
          msgs.forEach(msg => {
            if (msg.tipo === 'minha' || msg.tipo === 'outro') {
              adicionarMensagemNaTela(msg.id, msg.autor, msg.texto, msg.tipo, msg.horario);
            }
          });
          adicionarMensagemSistema('--- Histórico Carregado ---');
        }
      } catch (err) {
        mostrarToast('Erro ao importar o arquivo JSON.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  document.getElementById('inputMensagem').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') enviar();
  });
</script>

</body>
</html>
